name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: |
          chmod +x build.sh release.sh test.sh
          ./test.sh
          ./release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoverVolume-macOS
          path: |
            dist/HoverVolume-macOS.zip
            dist/HoverVolume-macOS.dmg
            dist/SHA256SUMS.txt

      - name: Create GitHub release and attach assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: HoverVolume ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/HoverVolume-macOS.zip
            dist/HoverVolume-macOS.dmg
            dist/SHA256SUMS.txt
